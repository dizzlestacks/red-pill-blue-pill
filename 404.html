<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#020804">
  <title>Page not found | WokeAreWe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#020804;color:#d6ffe2;font-family:"Share Tech Mono",monospace}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#00ff4110 3px 4px),radial-gradient(ellipse at 50% 35%,#00ff4114,transparent 65%)}
    main{position:relative;width:min(100%,560px);padding:clamp(26px,6vw,56px);border:1px solid #14692d;background:#031007e8;box-shadow:0 0 40px #00ff410c}
    main::before,main::after{content:"";position:absolute;width:24px;height:24px;border:2px solid #00ff41;pointer-events:none}
    main::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
    main::after{right:-2px;bottom:-2px;border-top:0;border-left:0}
    .brand{color:#79c78b;letter-spacing:.22em;font-size:14px;margin:0 0 32px}
    .code{color:#00ff41;font-size:clamp(72px,20vw,112px);line-height:1;margin:0;text-shadow:0 0 22px #00ff4160}
    h1{font-size:clamp(22px,6vw,30px);font-weight:400;text-transform:uppercase;letter-spacing:.06em;margin:16px 0}
    .message{line-height:1.7;color:#a3c5ab;margin:0 0 32px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 20px;border:1px solid #00ff41;color:#00ff41;text-decoration:none;text-transform:uppercase;letter-spacing:.08em}
    a:hover{background:#00ff411a;box-shadow:0 0 15px #00ff4120}
    a:focus-visible{outline:3px solid #d6ffe2;outline-offset:5px}
  </style>
</head>
<body>
  <main>
    <p class="brand">WOKEAREWE / SYSTEM NOTICE</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p class="message">This address doesn’t lead to a page.<br>Head back to the Video Hub.</p>
    <a href="/videos.html">Return to Video Hub →</a>
  </main>
</body>
</html>
