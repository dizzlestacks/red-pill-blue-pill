<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOST IMPORTANT CHOICE OF YOUR LIFE</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video id="introVideo" autoplay muted playsinline>
    <source src="The-Matrix-Blue-Pill-or-Red-Pill.mov" type="video/mp4">
    <source src="The-Matrix-Blue-Pill-or-Red-Pill.mp4" type="video/mp4">
    <source src="The-Matrix-Blue-Pill-or-Red-Pill.webm" type="video/webm">
    <source src="The-Matrix-Blue-Pill-or-Red-Pill.ogg" type="video/ogg">
    Your browser does not support the video tag.
  </video>

  <script>
    if (localStorage.getItem("splashSeen") === "true") {
      window.location.href = "videos.html";
    }

    const video = document.getElementById("introVideo");
    const redirectURL = "choice.html";
    let redirected = false;
    let timeout;

    function goToChoice() {
      if (!redirected) {
        redirected = true;
        clearTimeout(timeout);
        localStorage.setItem("splashSeen", "true");
        window.location.href = redirectURL;
      }
    }

    video.addEventListener("canplay", () => {
      video.muted = false;
      video.play().catch(() => {});
    });

    timeout = setTimeout(goToChoice, 154000);
    video.onended = goToChoice;
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") goToChoice();
    });
  </script>
</body>
</html>
