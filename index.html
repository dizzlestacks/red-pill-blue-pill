<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LISTEN AND CHOOSE</title>
  <style>
    :root { box-sizing: border-box; }
    *,*::before,*::after { box-sizing: inherit; }
    html, body {
      margin: 0; padding: 0;
      height: 100%; background: #000;
      overflow: hidden;                 /* keep page static */
      touch-action: manipulation;
    }

    /* Backdrop */
    .backdrop {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
    }

    /* Centered modal */
    .modal {
      position: relative;
      width: min(90vw, 900px);
      aspect-ratio: 16 / 9;             /* keeps a nice shape */
      background: #000;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08) inset;
      overflow: hidden;
    }

    /* Fit video fully (no cropping) */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;              /* key change: no cut-offs */
      background: #000;                 /* letterbox */
      display: block;
    }

    /* Minimal icon buttons */
    .icon-btn {
      position: absolute;
      top: 10px; right: 10px;
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.45);
      color: #fff;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2;
      backdrop-filter: blur(6px);
      font: 700 16px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .icon-btn:hover { background: rgba(255,255,255,.12); }

    /* Unmute chip (small, bottom-left) */
    .chip {
      position: absolute;
      left: 10px; bottom: 10px;
      display: inline-flex; gap: 6px; align-items: center;
      padding: 8px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(0,0,0,.45); color: #fff;
      cursor: pointer; z-index: 2; backdrop-filter: blur(6px);
      font: 600 12px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .hidden { display: none !important; }

    @media (max-width: 420px) {
      .modal { width: 94vw; }
      .icon-btn { width: 34px; height: 34px; font-size: 15px; }
      .chip { font-size: 11px; padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <script>
    // Skip splash if already seen
    if (localStorage.getItem("splashSeen") === "true") {
      window.location.replace("videos.html");
    }
  </script>

  <div class="backdrop" id="backdrop">
    <div class="modal">
      <button class="icon-btn" id="exitBtn" aria-label="Exit">✕</button>

      <video id="introVideo" autoplay muted playsinline preload="metadata">
        <!-- Primary MP4, then fallbacks -->
        <source src="The-Matrix-Blue-Pill-or-Red-Pill.mp4" type="video/mp4">
        <source src="The-Matrix-Blue-Pill-or-Red-Pill.webm" type="video/webm">
        <source src="The-Matrix-Blue-Pill-or-Red-Pill.ogg" type="video/ogg">
        Your browser does not support the video tag.
      </video>

      <button class="chip" id="unmuteChip" aria-label="Enable sound">🔊 Tap to unmute</button>
    </div>
  </div>

  <script>
    (function(){
      const video = document.getElementById("introVideo");
      const exitBtn = document.getElementById("exitBtn");
      const unmuteChip = document.getElementById("unmuteChip");
      const redirectURL = "choice.html";
      let redirected = false;
      let timeout;

      function goToChoice() {
        if (redirected) return;
        redirected = true;
        clearTimeout(timeout);
        localStorage.setItem("splashSeen", "true");
        window.location.replace(redirectURL);
      }

      // Autoplay kick
      const ensurePlay = () => video.play().catch(()=>{ /* ignore */ });
      video.addEventListener("canplay", ensurePlay, { once: true });
      ensurePlay();

      // Safe unmute on user action
      function tryUnmute() {
        if (!video.muted) return;
        video.muted = false;
        video.volume = 1;
        video.play().then(() => {
          unmuteChip.classList.add("hidden");
        }).catch(()=>{
          // Browser blocked; keep chip visible
          video.muted = true;
        });
      }
      unmuteChip.addEventListener("click", tryUnmute);
      // First tap on video also tries to unmute
      video.addEventListener("pointerdown", tryUnmute, { once: true });

      // Exit paths → pill choice
      exitBtn.addEventListener("click", goToChoice);
      video.addEventListener("ended", goToChoice);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") goToChoice();
      });
      window.addEventListener("blur", goToChoice);
      window.addEventListener("pagehide", goToChoice);

      // Safety timeout (same as before ~2m34s)
      timeout = setTimeout(goToChoice, 154000);
    })();
  </script>
</body>
</html>
