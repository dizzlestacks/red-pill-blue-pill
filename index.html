<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LISTEN AND CHOOSE</title>
  <style>
    :root { box-sizing: border-box; }
    *,*::before,*::after { box-sizing: inherit; }
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;            /* keep page static */
      touch-action: manipulation;  /* reduce accidental zoom/scroll */
    }
    .modal {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: #000;            /* solid black backdrop */
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }
    .controls {
      position: fixed;
      top: 12px; right: 12px;
      display: flex; gap: 8px;
      z-index: 3;
    }
    .btn {
      appearance: none; border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.45); color: #fff;
      padding: 8px 12px; border-radius: 10px; cursor: pointer;
      font: 600 14px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      backdrop-filter: blur(6px);
    }
    .btn:hover { background: rgba(255,255,255,.12); }
    .hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      color: #ddd; font: 500 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2);
      padding: 8px 12px; border-radius: 10px; z-index: 2;
      text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <script>
    // Skip splash if already seen
    if (localStorage.getItem("splashSeen") === "true") {
      window.location.replace("videos.html");
    }
  </script>

  <div class="modal" id="splash">
    <video id="introVideo" autoplay muted playsinline preload="metadata" crossorigin="anonymous">
      <!-- Primary .mp4, then fallbacks for max support -->
      <source src="The-Matrix-Blue-Pill-or-Red-Pill.mp4" type="video/mp4">
      <source src="The-Matrix-Blue-Pill-or-Red-Pill.webm" type="video/webm">
      <source src="The-Matrix-Blue-Pill-or-Red-Pill.ogg" type="video/ogg">
      Your browser does not support the video tag.
    </video>

    <!-- UI -->
    <div class="controls">
      <button class="btn" id="unmuteBtn">🔊 Unmute</button>
      <button class="btn" id="exitBtn">✕ Exit</button>
    </div>
    <div class="hint" id="hint">Video will auto-play. Tap 🔊 to enable sound. Tap ✕ to choose your pill.</div>
  </div>

  <script>
    (function(){
      const video = document.getElementById("introVideo");
      const unmuteBtn = document.getElementById("unmuteBtn");
      const exitBtn = document.getElementById("exitBtn");
      const hint = document.getElementById("hint");
      const redirectURL = "choice.html";
      let redirected = false;
      let timeout;

      function goToChoice() {
        if (redirected) return;
        redirected = true;
        clearTimeout(timeout);
        localStorage.setItem("splashSeen", "true");
        window.location.replace(redirectURL);
      }

      // Ensure autoplay kicks in on mobile (muted + playsinline)
      const ensurePlay = () => video.play().catch(() => {/* ignore */});

      // Try to unmute safely after user interaction
      function tryUnmute() {
        video.muted = false;
        video.volume = 1;
        video.play().then(()=>{
          hint.textContent = "Sound enabled. Tap ✕ to choose your pill.";
          unmuteBtn.classList.add("hidden");
        }).catch(()=>{
          // If browser blocks, keep muted and keep button visible
          video.muted = true;
        });
      }

      // Events → exit to choice
      video.addEventListener("ended", goToChoice);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") goToChoice();
      });
      window.addEventListener("pagehide", goToChoice);
      window.addEventListener("blur", goToChoice);

      // Make sure autoplay starts ASAP
      video.addEventListener("canplay", ensurePlay, { once: true });
      ensurePlay();

      // Fallback timeout (e.g., super long video)
      // Adjust if needed; currently ~2m34s like before:
      timeout = setTimeout(goToChoice, 154000);

      // Buttons
      unmuteBtn.addEventListener("click", tryUnmute);
      exitBtn.addEventListener("click", goToChoice);

      // First tap anywhere can also unmute (UX sugar)
      document.getElementById("splash").addEventListener("pointerdown", (e)=>{
        if (e.target === exitBtn || e.target === unmuteBtn) return;
        if (video.muted) tryUnmute();
      }, { once: true });
    })();
  </script>
</body>
</html>
