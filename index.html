<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Choice</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video id="introVideo" autoplay playsinline muted>
    <source src="The-Matrix-Blue-Pill-or-Red-Pill.mov" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    const redirectURL = "choice.html";
    const video = document.getElementById("introVideo");

    // If already watched, redirect to videos.html immediately
    if (localStorage.getItem("introWatched") === "true") {
      window.location.href = "videos.html";
    }

    // Unmute + autoplay logic for mobile
    video.addEventListener("canplay", () => {
      video.muted = false;
      video.play();
      requestFullScreen(video);
    });

    function requestFullScreen(element) {
      const request = element.requestFullscreen || element.webkitRequestFullscreen || element.msRequestFullscreen;
      if (request) request.call(element);
    }

    // Redirect logic
    let redirected = false;
    const goToChoice = () => {
      if (!redirected) {
        redirected = true;
        localStorage.setItem("introWatched", "true");
        window.location.href = redirectURL;
      }
    };

    // Redirect after 2:34 (154 seconds)
    setTimeout(goToChoice, 154000);

    // Redirect when video ends
    video.onended = goToChoice;

    // Redirect if user leaves the tab
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        goToChoice();
      }
    });
  </script>
</body>
</html>
