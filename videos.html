<!-- =========================
     /videos.html  (FULL FILE)
     ========================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VIDEO HUB</title>
  <link href="themes.css" rel="stylesheet">
  <style>
    /* Uses theme variables from themes.css */
    html, body { height:100%; max-width:100%; overflow-x:hidden; }
    body { margin:0; background:var(--bg); font-family:'Share Tech Mono', monospace; color:var(--fg); }
    .wrap { padding:16px; max-width:1200px; margin:0 auto; text-align:center; }

    /* Theme selector: small, simple */
    .theme-select { position:fixed; top:10px; right:10px; z-index:999;
      border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:6px; padding:4px 8px; font-size:.9rem; }

    /* Socials */
    .social-strip { display:flex; justify-content:center; gap:20px; margin:12px 0; }
    .social-strip img { height:40px; }

    /* Featured */
    .featured { margin:16px auto; border:1px solid var(--border); padding:10px; border-radius:8px; background:var(--card); box-shadow:var(--shadow); }
    .featured h2 { margin:0 0 10px; font-size:1.1rem; color:var(--muted); }

    /* Filters: search full width; category & sort on a single line */
    .filters { margin:16px auto 8px; display:flex; flex-direction:column; gap:10px; align-items:center; }
    .filters .search input {
      width:100%; max-width:860px; padding:12px 14px; border-radius:8px;
      border:1px solid var(--accent); background:var(--card); color:var(--fg);
    }
    .filters .row { display:flex; gap:10px; width:100%; max-width:860px; }
    .filters .row select { flex:1; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--fg); }
    .tool-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .tool-row button { padding:6px 10px; border:1px dashed var(--accent); background:transparent; color:var(--fg); border-radius:6px; cursor:pointer; }
    .tool-row button:hover { background:color-mix(in srgb, var(--accent) 16%, transparent); }

    /* Playlist: collapsible; small embeds */
    .playlist-box { margin:12px auto; border:1px solid var(--border); padding:10px; border-radius:8px; background:var(--card); box-shadow:var(--shadow); text-align:left; max-width:1200px; }
    .playlist-header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .playlist-header h2 { margin:0; font-size:1rem; color:var(--muted); }
    .playlist-toggle { border:1px dashed var(--accent); background:transparent; color:var(--fg); border-radius:6px; padding:6px 10px; cursor:pointer; }
    .playlist-list { display:none; margin-top:10px; }
    .playlist-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; }
    .playlist-item { border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:8px; }
    .playlist-item iframe { width:100%; aspect-ratio:16/9; }

    /* Cards */
    .video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-top:16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; box-shadow:var(--shadow); text-align:center; }
    .card h3 { margin:10px 0; font-size:1rem; }
    .meta { font-size:.9rem; color:color-mix(in srgb, var(--fg) 70%, transparent); }
    .tags { margin:6px 0; }
    .tag, .cat-chip {
      display:inline-block; padding:4px 8px; margin:3px; border-radius:4px;
      background:var(--tag-bg); color:var(--tag-fg); font-size:.8rem; cursor:pointer;
    }
    .btn { display:inline-block; margin:10px auto 0; padding:6px 12px; border:1px dashed var(--accent); background:transparent; color:var(--fg); border-radius:6px; cursor:pointer; }
    .btn:hover { background:color-mix(in srgb, var(--accent) 20%, transparent); }

    footer { margin:24px 0 20px; font-size:.9rem; color:var(--fg); text-align:center; }

    /* Styled popup */
    #popupOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:9999; padding:20px; }
    #popupBox { max-width:680px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px 24px; color:var(--fg); text-align:center; box-shadow:var(--shadow); }
    #popupBox h2 { margin:0 0 8px; color:var(--accent); font-size:1.2rem; }
    #popupMsg { white-space:pre-wrap; line-height:1.6; }
    #popupMsg .verse { font-style:italic; color:var(--muted); }
    #popupClose { margin-top:16px; padding:8px 14px; background:var(--accent); color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
    #popupClose:hover { opacity:.9; }

    @media (max-width:520px){
      .social-strip img { height:34px; }
    }
  </style>
</head>
<body class="dark">
  <!-- Small theme dropdown (no button) -->
  <select id="themeSelect" class="theme-select" title="Themes">
    <option value="">🎨Themes</option>
  </select>

  <!-- Styled popup (once) -->
  <div id="popupOverlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div id="popupBox">
      <h2 id="popupTitle">WELCOME OUT THE MATRIX!</h2>
      <div id="popupMsg"></div>
      <button id="popupClose">Enter</button>
    </div>
  </div>

  <div class="wrap">
    <!-- Socials -->
    <div class="social-strip">
      <a href="https://www.tiktok.com/@wokearewe1" target="_blank" rel="noopener"><img src="assets/tiktok.png" alt="TikTok"></a>
      <a href="https://www.instagram.com/wokearewe1" target="_blank" rel="noopener"><img src="assets/instagram.png" alt="Instagram"></a>
      <a href="https://x.com/wokearewe1" target="_blank" rel="noopener"><img src="assets/twitter.png" alt="Twitter"></a>
    </div>

    <!-- Featured -->
    <div id="featured" class="featured" style="display:none;">
      <h2>Featured</h2>
      <div id="featuredContainer"></div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="search">
        <input id="searchInput" type="text" placeholder="Search by title or tag..." />
      </div>
      <div class="row">
        <select id="categoryFilter"><option value="">All Categories</option></select>
        <select id="sortFilter">
          <option value="random">🎲 Random</option>
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="az">Title A–Z</option>
          <option value="za">Title Z–A</option>
          <option value="views">🔥 Most Watched</option>
        </select>
      </div>
      <div class="tool-row">
        <button id="clearFilters">Clear Filters</button>
      </div>
    </div>

    <!-- Playlists -->
    <div id="playlistBox" class="playlist-box" style="display:none;">
      <div class="playlist-header">
        <h2>Playlists</h2>
        <button id="playlistToggle" class="playlist-toggle" aria-expanded="false">Show</button>
      </div>
      <div id="playlistContainer" class="playlist-list">
        <div class="playlist-grid" id="playlistGrid"></div>
      </div>
    </div>

    <!-- Grids -->
    <div id="pinnedGrid" class="video-grid"></div>
    <div id="videoGrid" class="video-grid"></div>

    <footer id="footInfo"></footer>
  </div>

<script>
/* ---------- Theme setup ---------- */
const themes = [
  "dark","light","grey","pink","blue","vaporwave","solarized-dark","dracula","cyberpunk","sepia","midnight",
  "facebook","mcdonalds","walmart","office","discord","netflix","apple","google","amazon","spotify","twitch",
  "youtube","terminal","desert","ocean","forest","blood","gold","ice"
];
const themeSelect = document.getElementById("themeSelect");
themes.forEach(t => {
  const opt = document.createElement("option");
  opt.value = t; opt.textContent = t;
  themeSelect.appendChild(opt);
});
function setTheme(t){ document.body.className = t; localStorage.setItem("preferredTheme", t); }
(function initTheme(){
  const saved = localStorage.getItem("preferredTheme") || "dark";
  setTheme(saved);
  themeSelect.value = saved;
})();
themeSelect.addEventListener("change", () => {
  if (themes.includes(themeSelect.value)) setTheme(themeSelect.value);
});

/* ---------- Footer device/time ---------- */
function device(){
  const u = navigator.userAgent.toLowerCase();
  if (u.includes("iphone")) return "iPhone";
  if (u.includes("ipad")) return "iPad";
  if (u.includes("android")) return "Android";
  if (u.includes("mac")) return "Mac";
  if (u.includes("win")) return "PC";
  if (u.includes("linux")) return "Linux";
  return "Device";
}
function updateFooter(){ document.getElementById("footInfo").textContent = new Date().toLocaleTimeString() + " | " + device(); }
updateFooter();
setInterval(updateFooter, 1000);

/* ---------- Globals ---------- */
let APP_POPUP = { enabled:false, message:"" };
let videos = [];
let playlists = [];
let playlistOpen = false;

const els = {
  pinned: document.getElementById("pinnedGrid"),
  grid: document.getElementById("videoGrid"),
  featured: document.getElementById("featured"),
  fbox: document.getElementById("featuredContainer"),
  playlistBox: document.getElementById("playlistBox"),
  playlistToggle: document.getElementById("playlistToggle"),
  playlistContainer: document.getElementById("playlistContainer"),
  playlistGrid: document.getElementById("playlistGrid"),
  search: document.getElementById("searchInput"),
  cat: document.getElementById("categoryFilter"),
  sort: document.getElementById("sortFilter"),
};

/* ---------- Helpers ---------- */
function tagHTML(t){ const clean=(t||"").replace(/^#/,""); return `<span class="tag" data-tag="${clean}">#${clean}</span>`; }
function catChipHTML(c){ return `<span class="cat-chip" data-cat="${c}">${c}</span>`; }

function embedHTML(v){
  if (v.youtube_id){
    if (String(v.youtube_id).startsWith("PL")){
      return `<iframe src="https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(v.youtube_id)}" style="width:100%;aspect-ratio:16/9;" allowfullscreen loading="lazy"></iframe>`;
    }
    return `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(v.youtube_id)}" style="width:100%;aspect-ratio:16/9;" allowfullscreen loading="lazy"></iframe>`;
  }
  if (v.url) return `<video src="${v.url}" controls style="width:100%;height:auto;" preload="metadata"></video>`;
  return `<div class="meta">No source</div>`;
}

function shareLink(v){
  if (v.youtube_id){
    if (String(v.youtube_id).startsWith("PL")){
      return `https://www.youtube.com/playlist?list=${v.youtube_id}`;
    }
    return `https://youtu.be/${v.youtube_id}`;
  }
  return location.href;
}

async function shareVideo(v){
  const url = shareLink(v);
  try { await navigator.clipboard.writeText(url); alert("Link copied!"); }
  catch { prompt("Copy link:", url); }
}

function cardHTML(v, idx){
  const tags = (v.tags||[]).map(tagHTML).join("");
  const cats = (Array.isArray(v.category)?v.category:[v.category]).filter(Boolean).map(catChipHTML).join("");
  return `<div class="card">
    <h3>${v.title || "Untitled"}</h3>
    ${embedHTML(v)}
    <div class="meta">Category: ${cats || "—"}</div>
    <div class="tags">${tags}</div>
    <button class="btn" data-share="${idx}">🔗 Share</button>
  </div>`;
}

/* ---------- Popup render (with verse highlighting) ---------- */
function highlightVerses(text){
  // Simple heuristic: lines that look like "John 4:23" or contain "<Book> <num>:<num>"
  const verseRe = /(^|\s)([1-3]?\s?[A-Za-z]+)\s+(\d{1,3}):(\d{1,3})([^\S\r\n]|$)/;
  return text.split('\n').map(line => {
    return verseRe.test(line) ? `<span class="verse">${line}</span>` : line;
  }).join('\n');
}
function showPopupOnce(){
  if (!APP_POPUP.enabled) return;
  if (localStorage.getItem("popupShown")) return;
  const msg = APP_POPUP.message || "";
  const html = highlightVerses(msg);
  document.getElementById("popupMsg").innerHTML = html;
  const overlay = document.getElementById("popupOverlay");
  overlay.style.display = "flex";
  document.getElementById("popupClose").onclick = () => {
    overlay.style.display = "none";
    localStorage.setItem("popupShown", "true");
  };
}

/* ---------- Render ---------- */
function render(){
  // Featured
  const f = videos.find(v => v.featured);
  if (f){ els.featured.style.display=""; els.fbox.innerHTML = embedHTML(f); }
  else { els.featured.style.display="none"; els.fbox.innerHTML=""; }

  // Filter
  const q = (els.search.value||"").toLowerCase().trim();
  const cat = els.cat.value;
  const sort = els.sort.value || "random";

  // When playlist open, only playlists visible; grid hidden
  const isPlaylistMode = playlistOpen;

  let list = isPlaylistMode ? playlists.slice() : videos.slice();

  list = list.filter(v => {
    const matchesQ = !q ||
      (v.title && v.title.toLowerCase().includes(q)) ||
      (v.tags||[]).some(t => (t||"").toLowerCase().includes(q));
    const matchesC = !cat ||
      (Array.isArray(v.category) ? v.category.includes(cat) : v.category === cat);
    return matchesQ && matchesC;
  });

  if (sort === "newest") list.sort((a,b)=>new Date(b.added||0)-new Date(a.added||0));
  else if (sort === "oldest") list.sort((a,b)=>new Date(a.added||0)-new Date(b.added||0));
  else if (sort === "az") list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  else if (sort === "za") list.sort((a,b)=>(b.title||"").localeCompare(a.title||""));
  else if (sort === "views") list.sort((a,b)=>(b.views||0)-(a.views||0));
  else if (sort === "random") list.sort(()=>Math.random()-0.5);

  // Split pinned (skip featured to avoid dup)
  const pinned = list.filter(v => v.pinned && !v.featured);
  const others = list.filter(v => !v.pinned && !v.featured);

  els.pinned.innerHTML = isPlaylistMode ? "" : pinned.map(cardHTML).join("");
  els.grid.innerHTML   = isPlaylistMode ? "" : others.map(cardHTML).join("");

  // Wire clicks
  document.querySelectorAll(".tag").forEach(el=>{
    el.onclick = () => { els.search.value = el.dataset.tag||""; render(); };
  });
  document.querySelectorAll(".cat-chip").forEach(el=>{
    el.onclick = () => { els.cat.value = el.dataset.cat||""; render(); };
  });
  document.querySelectorAll("[data-share]").forEach(el=>{
    el.onclick = () => { const idx = +el.getAttribute("data-share"); shareVideo(list[idx]); };
  });
}

/* ---------- Init ---------- */
fetch("videos.json", { cache:"no-store" })
  .then(r=>r.json())
  .then(d=>{
    // Accept object or legacy array
    if (Array.isArray(d)) {
      APP_POPUP = { enabled:false, message:"" };
      videos = d;
    } else {
      APP_POPUP = d.popup || { enabled:false, message:"" };
      videos = Array.isArray(d.videos) ? d.videos : [];
    }

    // Extract playlists
    playlists = videos.filter(v => v.youtube_id && String(v.youtube_id).startsWith("PL"));

    // Populate categories
    const cats = [
      ...new Set(videos.map(v => Array.isArray(v.category)?v.category:[v.category]).flat().filter(Boolean))
    ].sort((a,b)=>a.localeCompare(b));
    const sel = els.cat;
    cats.forEach(c => { const o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o); });

    // Build playlist list
    if (playlists.length){
      els.playlistBox.style.display = "";
      els.playlistGrid.innerHTML = playlists.map(v => `
        <div class="playlist-item">
          <div class="meta" style="margin-bottom:6px;">${v.title||"Playlist"}</div>
          ${embedHTML(v)}
          <div style="text-align:center;margin-top:6px;">
            <button class="btn" onclick='(${shareVideo.toString()})(${JSON.stringify(v)})'>🔗 Share</button>
          </div>
        </div>
      `).join("");
    } else {
      els.playlistBox.style.display = "none";
    }

    // Toggle playlist mode
    els.playlistToggle.addEventListener("click", ()=>{
      playlistOpen = !playlistOpen;
      els.playlistContainer.style.display = playlistOpen ? "block" : "none";
      els.playlistToggle.textContent = playlistOpen ? "Hide" : "Show";
      els.playlistToggle.setAttribute("aria-expanded", String(playlistOpen));
      render();
    });

    // Popup once
    showPopupOnce();

    // Render
    render();

    // Hash scroll
    if (location.hash){
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
    }
  })
  .catch(err => {
    console.error("Failed to load videos.json", err);
    alert("Failed to load videos.");
  });

// Events
document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("categoryFilter").addEventListener("change", render);
document.getElementById("sortFilter").addEventListener("change", render);
document.getElementById("clearFilters").addEventListener("click", ()=>{
  document.getElementById("searchInput").value = "";
  document.getElementById("categoryFilter").value = "";
  document.getElementById("sortFilter").value = "random";
  render();
});
</script>
</body>
</html>
