<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VIDEO HUB</title>

  <link rel="icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512x512.png">

  <meta property="og:title" content="Incoming Transmission">
  <meta property="og:description" content="Videos of the unfiltered truth about the world.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/favicon-512x512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Incoming Transmission">
  <meta name="twitter:description" content="Videos of the unfiltered truth about the world.">
  <meta name="twitter:image" content="assets/favicon-512x512.png">

  <link href="themes.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root{
      box-sizing:border-box;
      --meta-h: 28px;
      --theme-h: 28px;
      --social-h: 28px;
      --glow: rgba(0,255,65,.35);
      --glow-strong: rgba(0,255,65,.6);
      --bar-a: color-mix(in srgb, var(--bg) 78%, var(--accent) 8%, black);
      --bar-b: color-mix(in srgb, var(--bg) 65%, var(--accent) 14%, black);
      --bar-border: color-mix(in srgb, var(--accent) 38%, var(--border));
      --bar-glow: 0 0 18px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    *, *::before, *::after { box-sizing:inherit; }

    html, body { height:100%; max-width:100%; margin:0; padding:0; overflow-x:hidden; }

    body{
      background:var(--bg);
      color:var(--fg);
      font-family:'Share Tech Mono', monospace;
      position:relative;
    }

    input, button, select, textarea {
      font-family:inherit !important;
      letter-spacing:.04em;
    }

    #matrixRain{
      position:fixed; inset:0; z-index:1; display:block; pointer-events:none;
      opacity:.08;
      mix-blend-mode:screen;
      will-change:transform;
      -webkit-transform:translateZ(0);
      transform:translateZ(0);
    }

    #loading{
      position:fixed; inset:0; display:grid; place-items:center; z-index:9998;
      background: radial-gradient(900px 600px at 50% 50%, rgba(0,0,0,.55), rgba(0,0,0,.9) 60%, #000);
    }
    .ring{
      width:46px; height:46px; border-radius:50%;
      border:3px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    @keyframes spin{ to{ transform:rotate(360deg);} }
    .hide{ opacity:0; pointer-events:none; transition: opacity .2s ease; }

    .bar-inner{
      width:min(1200px, 100%);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:10px;
      padding:0 10px;
    }

    .top-learn{
      position:sticky; top:0; z-index:80;
      padding:4px 0;
      background: linear-gradient(90deg, var(--bar-a), var(--bar-b), var(--bar-a));
      border-bottom:1px solid var(--bar-border);
      box-shadow: var(--bar-glow);
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size:.62rem;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
    }
    .top-learn a{
      color: var(--accent);
      text-decoration:none;
      border-bottom:1px dashed color-mix(in srgb, var(--accent) 70%, transparent);
      text-shadow:0 0 8px color-mix(in srgb, var(--accent) 22%, transparent);
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
      padding:2px 0;
      transition: color .15s, text-shadow .15s;
    }
    .top-learn a:hover {
      color: #fff;
      text-shadow: 0 0 14px var(--accent);
    }

    .top-theme{
      position:sticky; top: var(--meta-h); z-index:79;
      padding:4px 0;
      background: linear-gradient(90deg, var(--bar-a), var(--bar-b), var(--bar-a));
      border-bottom:1px solid var(--bar-border);
      box-shadow: var(--bar-glow);
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size:.62rem;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
    }
    .palette-label{
      background:transparent;
      border:none;
      padding:0;
      margin:0;
      color:var(--accent);
      text-shadow:0 0 8px color-mix(in srgb, var(--accent) 22%, transparent);
      font-size:.82rem;
      line-height:1;
      flex:0 0 auto;
    }
    .theme-select{
      border:1px solid var(--bar-border);
      background: color-mix(in srgb, var(--card) 92%, var(--bg));
      color:var(--fg);
      border-radius:6px;
      padding:2px 10px;
      font-size:.66rem;
      letter-spacing:.10em;
      text-transform:uppercase;
      outline:none;
      max-width:min(520px, 78vw);
      width:100%;
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 14%, transparent);
      transition: border-color .2s, box-shadow .2s;
    }
    .theme-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .top-social{
      position:sticky; top: calc(var(--meta-h) + var(--theme-h)); z-index:78;
      padding:4px 0;
      background: linear-gradient(90deg, var(--bar-a), var(--bar-b), var(--bar-a));
      border-bottom:1px solid var(--bar-border);
      box-shadow: var(--bar-glow);
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size:.60rem;
      line-height:1.15;
    }
    .top-social .bar-inner{ flex-wrap:wrap; gap:10px; }
    .top-social a{
      color: var(--accent);
      text-decoration:none;
      border-bottom:1px dashed color-mix(in srgb, var(--accent) 70%, transparent);
      text-shadow:0 0 8px color-mix(in srgb, var(--accent) 22%, transparent);
      padding:2px 0;
      transition: color .15s, text-shadow .15s;
    }
    .top-social a:hover {
      color: #fff;
      text-shadow: 0 0 14px var(--accent);
    }

    .hud-buttons{
      position:sticky; top: calc(var(--meta-h) + var(--theme-h) + var(--social-h)); z-index:77;
      padding:4px 0;
      background: linear-gradient(90deg, var(--bar-a), var(--bar-b), var(--bar-a));
      border-bottom:1px solid var(--bar-border);
      box-shadow: var(--bar-glow);
      backdrop-filter: blur(6px);
      white-space:nowrap;
      overflow:hidden;
    }
    .hud-buttons .bar-inner{ flex-wrap:wrap; gap:6px; }
    .hud-tab{
      cursor:pointer; user-select:none;
      padding:3px 8px;
      border-radius:4px;
      border:1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
      background: rgba(0,0,0,.4);
      color:var(--fg);
      font-size:.66rem;
      letter-spacing:.10em;
      text-transform:uppercase;
      box-shadow: 0 0 8px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.03);
      transition: transform .1s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
    }
    .hud-tab:hover{
      transform: translateY(-1px);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }
    .hud-tab.active{
      background: color-mix(in srgb, var(--accent) 18%, var(--card));
      border-color: var(--accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 30%, transparent), inset 0 0 0 1px rgba(255,255,255,.04);
      color: var(--accent);
    }

    .wrap{ padding:10px 12px 60px; max-width:1200px; margin:0 auto; position:relative; }

    .hub-title {
      text-align:center;
      margin: 16px 0 4px;
      font-size: clamp(16px, 4vw, 24px);
      color: var(--accent);
      text-transform:uppercase;
      letter-spacing:.14em;
      text-shadow: 0 0 12px var(--glow);
      animation: titleGlitch 6s infinite;
    }
    @keyframes titleGlitch {
      0%,100% { text-shadow: 0 0 12px var(--glow); transform:none; }
      18% { text-shadow: -2px 0 rgba(255,0,65,.5), 2px 0 rgba(0,255,200,.5); transform:translate(-1px,0); }
      19.5% { text-shadow: 2px 0 rgba(255,0,65,.5), -2px 0 rgba(0,255,200,.5); transform:translate(1px,0); }
      21% { text-shadow: 0 0 12px var(--glow); transform:none; }
    }

    .hub-signal {
      text-align:center;
      font-size:.72rem;
      color: color-mix(in srgb, var(--accent) 55%, transparent);
      letter-spacing:.12em;
      text-transform:uppercase;
      margin-bottom:12px;
      animation: signalPulse 3s ease-in-out infinite;
    }
    @keyframes signalPulse {
      0%,100% { opacity:.6; }
      50% { opacity:1; }
    }

    .controls{
      display:flex; flex-direction:column; align-items:center;
      gap:8px; margin:0 auto 8px;
    }
    .search-row{ width:100%; display:flex; justify-content:center; }
    #searchInput{
      width:100%; max-width:760px;
      padding:10px 14px;
      border-radius:6px;
      border:1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
      background: rgba(0,0,0,.5);
      color:var(--fg);
      font-size:.90rem;
      outline:none;
      transition: border-color .2s, box-shadow .2s;
    }
    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 18%, transparent),
                  inset 0 0 20px color-mix(in srgb, var(--accent) 4%, transparent);
    }
    #searchInput::placeholder { color: color-mix(in srgb, var(--accent) 30%, transparent); }

    .filter-row{
      display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center;
    }
    .filter-row select, .filter-row button{
      padding:6px 10px;
      border-radius:6px;
      border:1px solid color-mix(in srgb, var(--accent) 20%, var(--border));
      background: rgba(0,0,0,.4);
      color:var(--fg);
      font-size:.78rem;
      text-transform:uppercase;
      letter-spacing:.06em;
      outline:none;
      cursor:pointer;
      transition: border-color .2s, box-shadow .2s, background .15s;
    }
    .filter-row select:focus, .filter-row button:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 15%, transparent);
    }
    .filter-row button:hover {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-color: var(--accent);
    }
    .result-count{
      text-align:center;
      font-size:.80rem;
      color: color-mix(in srgb, var(--accent) 50%, var(--fg));
      margin-top:2px;
      letter-spacing:.06em;
    }

    .lucky-row{ display:flex; justify-content:center; margin: 8px 0 6px; }
    .lucky-btn{
      padding:8px 18px;
      border-radius:4px;
      border:1px solid color-mix(in srgb, var(--accent) 50%, var(--border));
      background: rgba(0,0,0,.4);
      color: var(--accent);
      font-size:.72rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      cursor:pointer;
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 10%, transparent);
      transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
    }
    .lucky-btn:hover{
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-color: var(--accent);
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 25%, transparent);
      transform: translateY(-1px);
    }
    .lucky-btn:active { transform: translateY(0) scale(.98); }

    .video-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:16px;
      margin-top:10px;
    }
    .card{
      background: rgba(0,0,0,.4);
      border:1px solid color-mix(in srgb, var(--accent) 12%, var(--border));
      border-radius:8px;
      padding:10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.4);
      text-align:left;
      display:flex;
      flex-direction:column;
      gap:6px;
      overflow:hidden;
      backdrop-filter: blur(4px);
      transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover{
      transform:translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent),
                  0 8px 30px rgba(0,0,0,.5);
    }

    .thumb-wrap{
      border-radius:6px;
      overflow:hidden;
      background:#000;
      aspect-ratio:16/9;
      position:relative;
      border: 1px solid color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .thumb-wrap iframe, .thumb-wrap video, .thumb-wrap img{
      width:100%; height:100%;
      border:0; display:block;
      object-fit:cover;
    }
    .thumb-badge{
      position:absolute;
      left:6px; bottom:6px;
      padding:2px 6px;
      border-radius:3px;
      font-size:.68rem;
      background: rgba(0,0,0,.7);
      border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      color: var(--accent);
      letter-spacing:.06em;
      text-transform:uppercase;
      user-select:none;
      backdrop-filter: blur(4px);
    }

    .card-title{
      font-size:.92rem;
      font-weight:700;
      line-height:1.3;
      margin-top:2px;
      color: var(--fg);
    }
    .meta-line{
      font-size:.78rem;
      color: color-mix(in srgb, var(--accent) 40%, var(--fg));
      letter-spacing:.04em;
    }
    .chips{ margin-top:2px; }
    .cat-chip{
      display:inline-block;
      padding:2px 7px;
      margin:2px 3px 0 0;
      border-radius:3px;
      font-size:.70rem;
      cursor:pointer;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      color: var(--accent);
      text-transform:uppercase;
      letter-spacing:.06em;
      transition: background .15s, border-color .15s;
    }
    .cat-chip:hover {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      border-color: var(--accent);
    }

    .card-actions{ margin-top:6px; display:flex; gap:6px; }
    .btn{
      flex:1;
      padding:6px 10px;
      border-radius:4px;
      border:1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
      background: rgba(0,0,0,.3);
      color:var(--fg);
      font-size:.76rem;
      cursor:pointer;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:.08em;
      transition: background .15s, border-color .15s, color .15s, transform .1s;
    }
    .btn.secondary{ border-color: color-mix(in srgb, var(--accent) 18%, var(--border)); }
    .btn:hover{
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0) scale(.98); }

    .playlist-box{
      margin:18px auto 4px;
      border:1px solid color-mix(in srgb, var(--accent) 12%, var(--border));
      padding:14px;
      border-radius:8px;
      background: rgba(0,0,0,.4);
      box-shadow: 0 2px 12px rgba(0,0,0,.4);
      max-width:1100px;
      backdrop-filter: blur(4px);
    }

    footer{
      margin:26px 0 30px;
      font-size:.78rem;
      text-align:center;
      letter-spacing:.10em;
      text-transform:uppercase;
      color: color-mix(in srgb, var(--accent) 40%, var(--fg));
    }
    footer::before { content: '[ '; color: color-mix(in srgb, var(--accent) 30%, transparent); }
    footer::after { content: ' ]'; color: color-mix(in srgb, var(--accent) 30%, transparent); }

    #popupOverlay{
      position:fixed; inset:0;
      background: radial-gradient(900px 600px at 50% 50%, rgba(0,0,0,.7), rgba(0,0,0,.92) 60%, #000 100%);
      backdrop-filter: blur(3px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9996;
      padding:20px;
    }
    #popupOverlay::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom, transparent 0px, transparent 2px,
        rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 3px
      );
      pointer-events: none;
      z-index: 0;
    }
    #popupBox{
      position: relative; z-index: 1;
      width:min(92vw, 580px);
      background: rgba(0,0,0,.85);
      border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius:8px;
      padding:30px 28px;
      text-align:center;
      box-shadow: 0 20px 70px rgba(0,0,0,.7),
                  0 0 40px color-mix(in srgb, var(--accent) 8%, transparent);
      transform: translateY(8px) scale(.98);
      opacity: 0;
      animation: popBoxIn .4s cubic-bezier(.2,.8,.2,1) .08s forwards;
    }
    @keyframes popBoxIn { to { transform: translateY(0) scale(1); opacity: 1; } }
    #popupBox::before {
      content: '';
      position:absolute; top:6px; left:6px;
      width:14px; height:14px;
      border-top:2px solid var(--accent);
      border-left:2px solid var(--accent);
      pointer-events:none;
      opacity:.5;
    }
    #popupBox::after {
      content: '';
      position:absolute; bottom:6px; right:6px;
      width:14px; height:14px;
      border-bottom:2px solid var(--accent);
      border-right:2px solid var(--accent);
      pointer-events:none;
      opacity:.5;
    }
    #popupBox h2{
      margin:0 0 14px;
      color: var(--accent);
      font-size:clamp(15px, 3.2vw, 20px);
      letter-spacing:.12em;
      text-transform:uppercase;
      text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent);
      animation: popGlitch 5s infinite;
    }
    @keyframes popGlitch {
      0%,100%  { text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent); transform: none; }
      20%      { text-shadow: -2px 0 rgba(255,0,65,.6), 2px 0 rgba(0,255,200,.6); transform: translate(-1px,0); }
      21%      { text-shadow: 2px 0 rgba(255,0,65,.6), -2px 0 rgba(0,255,200,.6); transform: translate(1px,0); }
      22%      { text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent); transform: none; }
    }
    #popupMsg{
      white-space:pre-wrap;
      line-height:1.8;
      text-align:center;
      color: color-mix(in srgb, var(--fg) 90%, var(--accent));
      font-size: clamp(12px, 2.4vw, 14px);
    }
    #popupMsg .verse{ font-style:italic; color: color-mix(in srgb, var(--accent) 55%, transparent); }
    #popupClose{
      margin-top:18px;
      padding:12px 32px;
      background: rgba(0,0,0,.5);
      color: var(--accent);
      border:1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      border-radius:4px;
      font-weight:700;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-family:'Share Tech Mono', monospace;
      font-size: clamp(13px, 2.4vw, 15px);
      transition: background .15s, border-color .15s, transform .1s;
    }
    #popupClose::after {
      content: '_';
      animation: popBlink .9s step-end infinite;
      margin-left: 2px;
    }
    @keyframes popBlink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    #popupClose:hover{
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    #popupClose:active { transform: translateY(0) scale(.98); }

    #scanlines {
      position: fixed; inset: 0; z-index: 9989;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,.055) 3px,
        rgba(0,0,0,.055) 4px
      );
      animation: scanDrift 14s linear infinite;
    }
    @keyframes scanDrift {
      from { background-position: 0 0; }
      to   { background-position: 0 120px; }
    }

    #scanbar {
      position: fixed; left:0; right:0; height:4px; z-index:9990;
      pointer-events: none;
      background: linear-gradient(to bottom,
        transparent,
        color-mix(in srgb, var(--accent) 8%, transparent) 40%,
        rgba(255,255,255,.04) 50%,
        color-mix(in srgb, var(--accent) 8%, transparent) 60%,
        transparent
      );
      animation: scanBarMove 4s linear infinite;
    }
    @keyframes scanBarMove {
      from { top: -4px; }
      to   { top: 100%; }
    }

    #vignette {
      position: fixed; inset: 0; z-index: 9988;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
    }

    .green-tint {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: rgba(0,255,65,.03);
      mix-blend-mode: overlay;
    }

    .flicker-overlay {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      animation: flicker 0.15s infinite;
      background: transparent;
    }
    @keyframes flicker {
      0%   { opacity: 1; }
      50%  { opacity: .97; }
      100% { opacity: 1; }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card { animation: cardIn .3s ease both; }

  <script>
    function updateStickyHeights(){
      const learn = document.getElementById("topLearn");
      const theme = document.getElementById("topTheme");
      const social = document.getElementById("topSocial");
      if (learn)  document.documentElement.style.setProperty("--meta-h",  Math.ceil(learn.getBoundingClientRect().height)  + "px");
      if (theme)  document.documentElement.style.setProperty("--theme-h", Math.ceil(theme.getBoundingClientRect().height)  + "px");
      if (social) document.documentElement.style.setProperty("--social-h",Math.ceil(social.getBoundingClientRect().height) + "px");
    }
    window.addEventListener("resize", updateStickyHeights, { passive:true });
    window.addEventListener("load", updateStickyHeights, { passive:true });
    updateStickyHeights();

    const THEMES = [
      "dark","light","grey","pink","blue","vaporwave","solarized-dark","dracula","cyberpunk","sepia","midnight",
      "facebook","mcdonalds","walmart","office","discord","netflix","apple","google","amazon","spotify","twitch",
      "youtube","terminal","desert","ocean","forest","blood","gold","ice"
    ];
    const themeSelect = document.getElementById("themeSelect");
    THEMES.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = t.toUpperCase();
      themeSelect.appendChild(opt);
    });

    function setTheme(t){
      document.body.className = t;
      localStorage.setItem("preferredTheme", t);
      document.dispatchEvent(new CustomEvent("themechange", { detail:{ theme:t } }));
    }
    (function initTheme(){
      const saved = localStorage.getItem("preferredTheme") || "terminal";
      setTheme(saved);
      themeSelect.value = saved;
    })();

    themeSelect.addEventListener("change", () => {
      if (THEMES.includes(themeSelect.value)) setTheme(themeSelect.value);
    });

    function device(){
      const u = navigator.userAgent.toLowerCase();
      if (u.includes("iphone")) return "iphone";
      if (u.includes("ipad")) return "ipad";
      if (u.includes("android")) return "android";
      if (u.includes("mac")) return "mac";
      if (u.includes("win")) return "pc";
      if (u.includes("linux")) return "linux";
      return "device";
    }
    function updateFooter(){
      const el = document.getElementById("footInfo");
      if (!el) return;
      el.textContent = new Date().toLocaleTimeString() + " | " + device();
    }
    updateFooter();
    setInterval(updateFooter, 1000);

    (function(){
      const btn = document.getElementById("luckyBtn");
      if (!btn) return;

      let all = [];
      function normalizePayload(d){
        if (Array.isArray(d)) return d;
        if (d && Array.isArray(d.videos)) return d.videos;
        if (Array.isArray(d?.[0]?.videos)) return d[0].videos;
        return [];
      }
      function isPlaylist(v){ return v?.youtube_id && String(v.youtube_id).startsWith("PL"); }
      function catArray(v){
        if (!v?.category) return [];
        return Array.isArray(v.category) ? v.category.filter(Boolean) : [v.category];
      }
      function shareLink(v){
        if (v.youtube_id) {
          if (isPlaylist(v)) return "https://www.youtube.com/playlist?list=" + v.youtube_id;
          return "https://youtu.be/" + v.youtube_id;
        }
        if (v.url) return v.url;
        return location.href;
      }

      fetch("videos.json", { cache: "no-store" })
        .then(r => r.json())
        .then(data => { all = normalizePayload(data).filter(v => !isPlaylist(v) && (v.youtube_id || v.url)); })
        .catch(()=>{ all = []; });

      btn.addEventListener("click", () => {
        if (!all.length) { alert("No videos loaded yet. Try again."); return; }

        const qRaw = (document.getElementById("searchInput")?.value || "").trim();
        const q = qRaw.toLowerCase();
        const catVal = (document.getElementById("categoryFilter")?.value || "").trim().toLowerCase();

        const filtered = all.filter(v => {
          const cats = catArray(v).map(c => String(c).trim());
          const catsLower = cats.map(c => c.toLowerCase());
          const tagsLower = (v.tags || []).map(t => String(t||"").toLowerCase());
          const titleLower = String(v.title || "").toLowerCase();

          if (catVal && !catsLower.some(c => c === catVal)) return false;
          if (!q) return true;

          const isTagMode = qRaw.startsWith("#");
          const tq = isTagMode ? qRaw.replace(/^#/, "").toLowerCase() : null;

          if (isTagMode) return tagsLower.some(t => t.includes(tq)) || catsLower.some(c => c.includes(tq));
          return titleLower.includes(q) || tagsLower.some(t => t.includes(q)) || catsLower.some(c => c.includes(q));
        });

        const pickFrom = filtered.length ? filtered : all;
        const v = pickFrom[(Math.random() * pickFrom.length) | 0];
        window.open(shareLink(v), "_blank", "noopener");
      });
    })();

    (function(){
      const canvas = document.getElementById("matrixRain");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const chars = '\uff66\uff67\uff68\uff69\uff6a\uff6b\uff6c\uff6d\uff6e\uff6f\uff70\uff71\uff72\uff73\uff74\uff75\uff76\uff77\uff78\uff79\uff7a\uff7b\uff7c\uff7d\uff7e\uff7f\uff80\uff81\uff82\uff83\uff84\uff85\uff86\uff87\uff88\uff89\uff8a\uff8b\uff8c\uff8d\uff8e\uff8f\uff90\uff91\uff92\uff93\uff94\uff95\uff96\uff97\uff98\uff99\uff9a\uff9b\uff9c\uff9d' +
                   '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ' +
                   '\u0391\u0392\u0393\u0394\u0395\u0396\u0397\u0398\u0399\u039a\u039b\u039c\u039d\u039e\u039f\u03a0\u03a1\u03a3\u03a4\u03a5\u03a6\u03a7\u03a8\u03a9\u03b1\u03b2\u03b3\u03b4\u03b5\u03b6\u03b7\u03b8';
      let W, H, cols, drops, fontSize = 16, running = true;

      function resize(){
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        cols = Math.floor(W / fontSize);
        drops = new Array(cols).fill(0).map(function(){ return -(Math.random() * (H / fontSize)); });
        ctx.font = fontSize + "px monospace";
      }
      window.addEventListener("resize", resize, { passive:true });
      resize();

      document.addEventListener("visibilitychange", function(){
        running = document.visibilityState === "visible";
      });

      (function tick(){
        requestAnimationFrame(tick);
        if (!running) return;
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < cols; i++){
          var x = i * fontSize;
          var y = drops[i] * fontSize;
          ctx.fillStyle = "#afffbf";
          ctx.fillText(chars[(Math.random() * chars.length) | 0], x, y);
          ctx.fillStyle = "#00ff41";
          ctx.fillText(chars[(Math.random() * chars.length) | 0], x, y - fontSize);
          if (y > H && Math.random() > 0.975) drops[i] = -(Math.random() * 20);
          drops[i] += 0.5;
        }
      })();
    })();
