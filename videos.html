<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Videos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ========= THEME SYSTEM (easy to tweak) ========= */
  :root {
    --bg: #000; --fg: #e6ffe6; --card:#111; --accent:#00ff41; --muted:#7bd58a;
    --font: 'Share Tech Mono', monospace;
    --tag-bg:#00331a; --tag-fg:#caffcf; --border:#0a8f3a; --shadow: 0 0 10px rgba(0,255,65,.25);
  }
  body { background:var(--bg); color:var(--fg); margin:0; font-family: var(--font), system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

  /* LIGHT */
  body.light { --bg:#ffffff; --fg:#111; --card:#fff; --accent:#007BFF; --muted:#3b82f6; --font:'Inter',sans-serif; --tag-bg:#eef2ff; --tag-fg:#111; --border:#cbd5e1; --shadow: 0 0 8px rgba(0,123,255,.15); }
  /* GREY */
  body.grey  { --bg:#111; --fg:#ddd; --card:#1c1c1c; --accent:#888; --muted:#aaa; --font:'Inter',sans-serif; --tag-bg:#222; --tag-fg:#e7e7e7; --border:#2b2b2b; --shadow:0 0 8px rgba(200,200,200,.12); }
  /* PINK */
  body.pink  { --bg:#3a001e; --fg:#ffd6ec; --card:#4a002a; --accent:#ff4ebf; --muted:#ffa1d8; --font:'Inter',sans-serif; --tag-bg:#60003b; --tag-fg:#ffd6ec; --border:#ff4ebf; --shadow:0 0 10px rgba(255,78,191,.2); }
  /* BLUE / NAVY */
  body.blue  { --bg:#001f3f; --fg:#d8efff; --card:#002b5c; --accent:#3399ff; --muted:#66ccff; --font:'Inter',sans-serif; --tag-bg:#003b7a; --tag-fg:#e6f5ff; --border:#1f75d6; --shadow:0 0 10px rgba(51,153,255,.18); }
  /* VAPORWAVE */
  body.vaporwave { --bg:#2d0039; --fg:#ffb3ec; --card:#39004d; --accent:#00f6ff; --muted:#ffd166; --font:'Inter',sans-serif; --tag-bg:#4c0066; --tag-fg:#e8d7ff; --border:#00f6ff; --shadow:0 0 10px rgba(0,246,255,.2); }

  /* Solarized Dark */
  body["solarized-dark"], body.solarized-dark { --bg:#002b36; --fg:#93a1a1; --card:#073642; --accent:#268bd2; --muted:#b58900; --font:'Inter',sans-serif; --tag-bg:#073642; --tag-fg:#eee8d5; --border:#586e75; --shadow:0 0 10px rgba(38,139,210,.2); }
  /* Dracula */
  body.dracula { --bg:#282a36; --fg:#f8f8f2; --card:#44475a; --accent:#bd93f9; --muted:#50fa7b; --font:'Inter',sans-serif; --tag-bg:#3b3e56; --tag-fg:#f8f8f2; --border:#6272a4; --shadow:0 0 10px rgba(189,147,249,.22); }
  /* Cyberpunk Neon */
  body.cyberpunk { --bg:#0f0f0f; --fg:#eafffb; --card:#1a1a1a; --accent:#ff007c; --muted:#00ffe7; --font:'Share Tech Mono', monospace; --tag-bg:#262626; --tag-fg:#eafffb; --border:#00ffe7; --shadow:0 0 12px rgba(0,255,231,.22); }
  /* Sepia / Earth tones */
  body.sepia { --bg:#f4ecd8; --fg:#5c3e2b; --card:#e6d3b3; --accent:#a67c52; --muted:#7b5a3c; --font:'Inter',sans-serif; --tag-bg:#dbc6a1; --tag-fg:#4a3425; --border:#bfa07a; --shadow:0 0 8px rgba(166,124,82,.18); }
  /* Midnight Purple */
  body.midnight { --bg:#1e0033; --fg:#e0d7ff; --card:#2c0e4a; --accent:#8e44ad; --muted:#a66dd6; --font:'Inter',sans-serif; --tag-bg:#3e1f5c; --tag-fg:#f0eaff; --border:#5b2b7a; --shadow:0 0 10px rgba(142,68,173,.18); }

  /* ====== LAYOUT ====== */
  .wrap { padding: 16px; max-width: 1200px; margin: 0 auto; }
  .topbar { position: sticky; top:0; background: linear-gradient(to bottom, var(--bg), color-mix(in srgb, var(--bg) 80%, transparent)); z-index: 5; padding-top: 8px; }

  .theme-btn {
    position: fixed; top:10px; right:10px; z-index:999;
    background: var(--card); color: var(--fg); border:1px solid var(--border);
    padding:6px 10px; border-radius:6px; cursor:pointer; box-shadow: var(--shadow);
  }

  .social-strip { display:flex; justify-content:center; gap:22px; padding:8px 0 6px; }
  .social-strip img { height: 40px; width:auto; filter: drop-shadow(0 0 4px rgba(0,0,0,.25)); }

  .featured { margin-top: 10px; border:1px solid var(--border); background:var(--card); padding:10px; border-radius:8px; box-shadow: var(--shadow); }
  .featured h2 { margin: 0 0 10px 0; font-size:1.1rem; color: var(--muted); font-weight:600; }

  .filters { margin-top:16px; }
  .search { display:flex; justify-content:center; }
  .search input {
    width:100%; max-width:860px;
    padding:12px 14px; font-size:1.05rem;
    border:1px solid var(--accent); border-radius:8px; background:var(--card); color:var(--fg);
    box-shadow: 0 0 0px rgba(0,0,0,0), 0 0 18px rgba(0,0,0,0);
    outline: none;
  }
  .search input::placeholder { color: color-mix(in srgb, var(--fg) 70%, transparent); font-weight:600; }
  .search input:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }

  .row { display:flex; gap:10px; margin:12px auto 6px; max-width:860px; }
  .row select { flex:1; padding:10px; border:1px solid var(--border); background:var(--card); color:var(--fg); border-radius:8px; }

  .section-gap { height: 14px; }

  .video-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; margin-top:8px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; box-shadow: var(--shadow); position: relative; }
  .card h3 { margin:10px 0 8px; font-size: 1rem; line-height:1.3; }
  .tags { margin-top:4px; }
  .tag { display:inline-block; background:var(--tag-bg); color:var(--tag-fg); font-size:.8rem; padding:2px 6px; margin: 2px 4px 0 0; border-radius:4px; cursor:pointer; }

  .meta { font-size:.85rem; color: color-mix(in srgb, var(--fg) 70%, transparent); margin-top:6px; }

  .btn-row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .btn { border:1px dashed var(--accent); background:transparent; color:var(--fg); padding:6px 10px; border-radius:6px; cursor:pointer; }
  .btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

  /* Comments (collapsed by default) */
  .comment-wrap { margin-top:10px; border-top:1px dashed var(--border); padding-top:8px; display:none; }
  .comment-wrap form input, .comment-wrap form textarea {
    width:100%; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:8px; margin:6px 0;
  }

  footer { text-align:center; padding:12px 0 24px; font-size:.85rem; color: color-mix(in srgb, var(--fg) 75%, transparent); }

  /* Small screens tweaks */
  @media (max-width: 520px) {
    .social-strip img { height: 34px; }
  }
</style>
</head>
<body class="dark">
  <button class="theme-btn" id="themeBtn" title="Switch theme">🌓 Theme</button>

  <div class="topbar">
    <div class="wrap">
      <!-- Social media strip -->
      <div class="social-strip">
        <a href="https://www.tiktok.com/@wokearewe1?_t=ZM-8zJ7hUBLWGU&_r=1" title="TikTok"><img src="assets/tiktok.png" alt="TikTok"></a>
        <a href="https://www.instagram.com/wokearewe1?igsh=MWR2amxoZGZlaHBhZA==" title="Instagram"><img src="assets/instagram.png" alt="Instagram"></a>
        <a href="https://x.com/wokearewe1?s=21&t=1Dxo-m9ArDd-ERyD6K0R6Q" title="Twitter / X"><img src="assets/twitter.png" alt="Twitter"></a>
      </div>

      <!-- Featured video (kept) -->
      <div id="featured" class="featured" style="display:none;">
        <h2>Featured</h2>
        <div id="featuredContainer">Loading...</div>
      </div>

      <!-- Spacing -->
      <div class="section-gap"></div>

      <!-- Search -->
      <div class="filters">
        <div class="search">
          <input id="searchInput" type="text" placeholder="Search by title or tag..." />
        </div>
        <div class="row">
          <select id="categoryFilter">
            <option value="">All Categories</option>
          </select>
          <select id="sortFilter">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="az">Title A–Z</option>
            <option value="za">Title Z–A</option>
          </select>
        </div>
      </div>

      <!-- Pinned first, then others -->
      <div id="pinnedGrid" class="video-grid"></div>
      <div id="videoGrid" class="video-grid"></div>
    </div>
  </div>

  <div class="wrap">
    <footer id="footInfo"></footer>
  </div>

<script>
  /* ================= PREFERRED THEME (auto load) ================= */
  const themes = [
    "dark","light","grey","pink","blue","vaporwave",
    "solarized-dark","dracula","cyberpunk","sepia","midnight"
  ];
  const themeBtn = document.getElementById('themeBtn');

  function setTheme(t) {
    document.body.className = t;
    localStorage.setItem('preferredTheme', t);
  }
  // Load saved or default theme
  (function() {
    const saved = localStorage.getItem('preferredTheme');
    setTheme(saved || 'dark');
  })();

  themeBtn.addEventListener('click', () => {
    const current = document.body.className || 'dark';
    const idx = themes.indexOf(current);
    const next = themes[(idx + 1) % themes.length];
    setTheme(next);
  });

  /* ================= FOOTER: time + device ================= */
  function getDevice() {
    const ua = navigator.userAgent.toLowerCase();
    if (ua.includes("iphone")) return "iPhone";
    if (ua.includes("ipad")) return "iPad";
    if (ua.includes("android")) return "Android";
    if (ua.includes("mac")) return "Mac";
    if (ua.includes("windows")) return "PC";
    if (ua.includes("linux")) return "Linux";
    return "Device";
  }
  function tickFooter() {
    document.getElementById('footInfo').textContent =
      new Date().toLocaleTimeString() + " | " + getDevice();
  }
  setInterval(tickFooter, 1000); tickFooter();

  /* ================= STATE (search & filters persist) ================= */
  const SKEY = "videos-ui-state";
  function saveUIState() {
    const state = {
      q: document.getElementById('searchInput').value,
      cat: document.getElementById('categoryFilter').value,
      sort: document.getElementById('sortFilter').value
    };
    localStorage.setItem(SKEY, JSON.stringify(state));
  }
  function loadUIState() {
    try {
      const s = JSON.parse(localStorage.getItem(SKEY) || "{}");
      if (s.q !== undefined) document.getElementById('searchInput').value = s.q;
      if (s.cat !== undefined) document.getElementById('categoryFilter').value = s.cat;
      if (s.sort !== undefined) document.getElementById('sortFilter').value = s.sort;
    } catch {}
  }

  /* ================= RENDER ================= */
  let videos = [];
  const pinnedGrid = document.getElementById('pinnedGrid');
  const videoGrid = document.getElementById('videoGrid');
  const featuredBox = document.getElementById('featured');
  const featuredContainer = document.getElementById('featuredContainer');

  function tagHTML(tag) {
    const clean = tag.replace(/^#/, '');
    return `<span class="tag" data-tag="${clean}">#${clean}</span>`;
  }

  function videoEmbedHTML(v) {
    if (v.youtube_id) {
      return `<iframe src="https://www.youtube.com/embed/${v.youtube_id}" style="width:100%;aspect-ratio:16/9;" allowfullscreen loading="lazy"></iframe>`;
    }
    if (v.video_id) {
      return `<iframe src="https://iframe.videodelivery.net/${v.video_id}" style="width:100%;aspect-ratio:16/9;" allowfullscreen loading="lazy"></iframe>`;
    }
    if (v.dropbox_url || v.url) {
      const src = v.dropbox_url || v.url;
      return `<video src="${src}" controls style="width:100%;height:auto;"></video>`;
    }
    return `<div class="meta">No source found.</div>`;
  }

  function shareVideo(v) {
    const slug = v.title.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const url = `${location.origin}${location.pathname}#${slug}`;
    navigator.clipboard.writeText(url).then(() => alert("Video link copied!"));
  }

  function toggleComment(id) {
    const el = document.getElementById('cwrap-' + id);
    if (!el) return;
    el.style.display = (el.style.display === 'none' || !el.style.display) ? 'block' : 'none';
  }

  function commentFormHTML(v, idx) {
    /* Formspree: replace FORM_ENDPOINT with your endpoint like:
       https://formspree.io/f/xxxxabcd  */
    const FORM_ENDPOINT = "https://formspree.io/f/mvgqjjgw";
    const title = v.title || '';
    return `
      <div class="comment-wrap" id="cwrap-${idx}">
        <form action="${FORM_ENDPOINT}" method="POST">
          <input type="hidden" name="video_title" value="${title}">
          <input type="text" name="name" placeholder="Your name (optional)" />
          <input type="email" name="email" placeholder="Email (optional)" />
          <textarea name="comment" rows="4" placeholder="Write your comment..."></textarea>
          <button class="btn" type="submit">Submit Comment</button>
          <div class="meta">Comments are sent via Formspree (Netlify-friendly). Set your endpoint in the code.</div>
        </form>
      </div>
    `;
  }

  function cardHTML(v, idx) {
    const tags = (v.tags || []).map(tagHTML).join('');
    const embed = videoEmbedHTML(v);
    const slug = v.title ? v.title.toLowerCase().replace(/[^a-z0-9]+/g,'-') : ('v'+idx);
    return `
      <div class="card" id="${slug}">
        <h3>${v.title || 'Untitled'}</h3>
        ${embed}
        <div class="meta">Category: ${v.category || '—'}</div>
        <div class="tags">${tags}</div>
        <div class="btn-row">
          <button class="btn" data-share="${idx}">🔗 Share</button>
          <button class="btn" data-comment="${idx}">💬 Comment</button>
        </div>
        ${commentFormHTML(v, idx)}
      </div>
    `;
  }

  function render() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const cat = document.getElementById('categoryFilter').value;
    const sort = document.getElementById('sortFilter').value;

    // Featured
    const f = videos.find(v => v.featured);
    if (f) {
      featuredBox.style.display = '';
      featuredContainer.innerHTML = videoEmbedHTML(f);
    } else {
      featuredBox.style.display = 'none';
      featuredContainer.innerHTML = '';
    }

    // Filter
    let list = videos.filter(v => {
      const matchesQ = !q || (v.title && v.title.toLowerCase().includes(q)) ||
                       ((v.tags||[]).some(t => (t||'').toLowerCase().includes(q.replace('#',''))));
      const matchesC = !cat || (v.category === cat);
      return matchesQ && matchesC;
    });

    // Sort
    list.sort((a,b) => {
      if (sort === 'newest') return new Date(b.added||0) - new Date(a.added||0);
      if (sort === 'oldest') return new Date(a.added||0) - new Date(b.added||0);
      if (sort === 'az') return (a.title||'').localeCompare(b.title||'');
      if (sort === 'za') return (b.title||'').localeCompare(a.title||'');
      return 0;
    });

    // Split pinned first (skip featured to avoid duplication)
    const pinned = list.filter(v => v.pinned && !v.featured);
    const others = list.filter(v => !v.pinned && !v.featured);

    pinnedGrid.innerHTML = pinned.map(cardHTML).join('');
    videoGrid.innerHTML  = others.map(cardHTML).join('');

    // Wire tag clicks, share, comment toggles
    document.querySelectorAll('.tag').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('searchInput').value = el.dataset.tag || '';
        saveUIState(); render();
      });
    });
    document.querySelectorAll('[data-share]').forEach(el => {
      el.addEventListener('click', () => {
        const idx = +el.getAttribute('data-share');
        shareVideo(videos[idx]);
      });
    });
    document.querySelectorAll('[data-comment]').forEach(el => {
      el.addEventListener('click', () => {
        const idx = el.getAttribute('data-comment');
        toggleComment(idx);
      });
    });
  }

  // Load data
  fetch('videos.json')
    .then(r => r.json())
    .then(data => {
      videos = data || [];
      // Populate categories
      const cats = Array.from(new Set(videos.map(v => v.category).filter(Boolean))).sort();
      const sel = document.getElementById('categoryFilter');
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
      });
      // Restore UI state, then render
      loadUIState();
      render();

      // If hash present, scroll to that card
      if (location.hash) {
        const target = document.getElementById(location.hash.slice(1));
        if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });

  // Events & persistence
  document.getElementById('searchInput').addEventListener('input', () => { saveUIState(); render(); });
  document.getElementById('categoryFilter').addEventListener('change', () => { saveUIState(); render(); });
  document.getElementById('sortFilter').addEventListener('change', () => { saveUIState(); render(); });
</script>
</body>
</html>
