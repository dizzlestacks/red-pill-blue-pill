<!-- =========================
     /videos.html  (UI polish for mobile + tabs)
     ========================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VIDEO HUB</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link href="themes.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ===== Base ===== */
    html, body { height:100%; max-width:100%; overflow-x:hidden; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:'Share Tech Mono', monospace; }

    /* Cursor ring (desktop only) */
    body { cursor:none; }
    .cursor {
      position:fixed; left:0; top:0; width:18px; height:18px; margin:-9px 0 0 -9px;
      border:1px solid color-mix(in srgb, var(--accent) 80%, #fff);
      border-radius:50%; pointer-events:none; z-index:9999; mix-blend-mode:screen;
      transition: transform .06s linear, opacity .2s ease;
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    @media (pointer:coarse) { body { cursor:auto; } .cursor{ opacity:0!important; } }

    /* Loading overlay */
    #loading {
      position:fixed; inset:0; display:grid; place-items:center; z-index:9998;
      background: radial-gradient(900px 600px at 50% 50%, rgba(0,0,0,.55), rgba(0,0,0,.85) 60%, #000);
    }
    .ring {
      width:54px; height:54px; border-radius:50%;
      border:3px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .hide { opacity:0; pointer-events:none; transition: opacity .2s ease; }

    /* Top social bar (slightly taller than themes bar) */
    .top-social {
      position:sticky; top:0; z-index:60;
      display:flex; justify-content:center; gap:16px; flex-wrap:wrap;
      padding:10px 12px;
      background:color-mix(in srgb, var(--bg) 92%, black);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .top-social a {
      color: var(--accent); text-decoration:none;
      padding:2px 0; border-bottom:1px dashed var(--accent);
      font-size:.95rem;
    }

    /* Themes bar (thin) */
    .themes-bar {
      position:sticky; top:42px; z-index:59; /* sits just under social */
      display:flex; justify-content:center; padding:6px 10px;
      background:color-mix(in srgb, var(--bg) 96%, black);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .theme-select {
      border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:6px; padding:4px 8px; font-size:.85rem; min-width:130px;
    }

    /* Controls area */
    .wrap { padding:14px 12px 60px; max-width:1200px; margin:0 auto; }
    .controls {
      display:flex; flex-direction:column; align-items:center; gap:12px;
      margin:14px auto;
    }
    .search-row {
      width:100%; display:flex; justify-content:center;
    }
    .search-row input {
      width:100%; max-width:760px; /* uniform width */
      padding:12px 14px; border-radius:10px;
      border:1px solid var(--accent); background:var(--card); color:var(--fg);
    }

    /* Tabs – flashy pill buttons */
    .tabs {
      display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    }
    .tab {
      cursor:pointer; user-select:none;
      padding:8px 14px; border-radius:999px;
      border:1px solid color-mix(in srgb, var(--accent) 60%, var(--border));
      background:color-mix(in srgb, var(--card) 92%, var(--bg));
      color:var(--fg);
      box-shadow: 0 0 12px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.04);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .tab:hover { transform: translateY(-1px); }
    .tab.active {
      background: color-mix(in srgb, var(--accent) 20%, var(--card));
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 0 0 1px rgba(255,255,255,.05);
    }

    /* Filter row (centered) */
    .filter-row {
      display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    }
    .filter-row select, .filter-row button {
      padding:10px 12px; border-radius:8px;
      border:1px solid var(--border); background:var(--card); color:var(--fg);
    }
    .result-count { text-align:center; font-size:.92rem; color:color-mix(in srgb, var(--fg) 70%, transparent); margin-top:4px; }

    /* Featured */
    .featured {
      margin:10px auto 14px; border:1px solid var(--border); padding:10px; border-radius:12px;
      background:var(--card); box-shadow:var(--shadow); max-width: 1000px;
    }
    .featured h2 { margin:0 0 8px; font-size:1.05rem; color:var(--muted); text-align:center; }

    /* Grid */
    .video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-top:10px; }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px;
      box-shadow:var(--shadow); text-align:center; transition: transform .08s ease, box-shadow .12s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card h3 { margin:10px 0; font-size:1rem; }
    .meta { font-size:.9rem; color:color-mix(in srgb, var(--fg) 70%, transparent); }
    .tags { margin:6px 0; }
    .tag, .cat-chip {
      display:inline-block; padding:4px 8px; margin:3px; border-radius:4px;
      background:var(--tag-bg); color:var(--tag-fg); font-size:.8rem; cursor:pointer;
    }
    .btn { display:inline-block; margin:10px auto 0; padding:6px 12px; border:1px dashed var(--accent); background:transparent; color:var(--fg); border-radius:6px; cursor:pointer; }
    .btn:hover { background:color-mix(in srgb, var(--accent) 20%, transparent); }

    /* Playlists block */
    .playlist-box {
      margin:14px auto; border:1px solid var(--border); padding:10px; border-radius:12px;
      background:var(--card); box-shadow:var(--shadow); max-width: 1100px;
    }
    .playlist-header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .playlist-header h2 { margin:0; font-size:1rem; color:var(--muted); }
    .playlist-toggle { border:1px dashed var(--accent); background:transparent; color:var(--fg); border-radius:6px; padding:6px 10px; cursor:pointer; }
    .playlist-list { display:none; margin-top:10px; }
    .playlist-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; }
    .playlist-item { border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:8px; }
    .playlist-item iframe { width:100%; aspect-ratio:16/9; }

    footer { margin:26px 0 30px; font-size:.9rem; color:var(--fg); text-align:center; opacity:.85; }

    /* Popup (centered text already) */
    #popupOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:9996; padding:20px; }
    #popupBox { width:min(92vw, 760px); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px 24px; color:var(--fg); text-align:center; box-shadow:var(--shadow); }
    #popupBox h2 { margin:0 0 8px; color:var(--accent); font-size:1.2rem; }
    #popupMsg { white-space:pre-wrap; line-height:1.7; text-align:center; } /* centered */
    #popupMsg .verse { font-style:italic; color:var(--muted); }
    #popupClose { margin-top:16px; padding:10px 16px; background:var(--accent); color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
    #popupClose:hover { opacity:.92; }
  </style>
</head>
<body class="dark">
  <!-- cursor -->
  <div id="cursor" class="cursor"></div>

  <!-- loader -->
  <div id="loading"><div class="ring"></div></div>

  <!-- Social bar (topmost) -->
  <div class="top-social">
    <a href="https://www.tiktok.com/@wokearewe1" target="_blank" rel="noopener">TikTok</a>
    <a href="https://www.instagram.com/wokearewe1" target="_blank" rel="noopener">Instagram</a>
    <a href="https://x.com/wokearewe1" target="_blank" rel="noopener">Twitter</a>
    <a href="https://youtube.com/@prophecyministries?si=mZcOPp08umKEB3Q7" target="_blank" rel="noopener">Prophecy Ministries</a>
    <a href="https://youtube.com/@truthunedited?si=ZBoGbHwGPtKPs6oQ" target="_blank" rel="noopener">Truth Unedited</a>
  </div>

  <!-- Themes bar (thin) -->
  <div class="themes-bar">
    <select id="themeSelect" class="theme-select" title="Themes">
      <option value="">THEMES 🎨</option>
      <!-- options injected below -->
    </select>
  </div>

  <div class="wrap">
    <!-- Controls -->
    <div class="controls">
      <!-- Search -->
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Search by title or tag…"/>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button id="tab-all" class="tab active" type="button">All</button>
        <button id="tab-pinned" class="tab" type="button">Pinned</button>
        <button id="tab-playlists" class="tab" type="button">Playlists</button>
      </div>

      <!-- Centered filters -->
      <div class="filter-row">
        <select id="categoryFilter"><option value="">All Categories</option></select>
        <select id="sortFilter">
          <option value="random">🎲 Random</option>
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="az">Title A–Z</option>
          <option value="za">Title Z–A</option>
          <option value="views">🔥 Most Watched</option>
        </select>
        <button id="clearFilters" type="button">Clear</button>
      </div>
      <div id="resultCount" class="result-count">Showing 0</div>
    </div>

    <!-- Featured -->
    <section id="featured" class="featured" style="display:none;">
      <h2>Featured</h2>
      <div id="featuredContainer"></div>
    </section>

    <!-- Playlists -->
    <section id="playlistBox" class="playlist-box" style="display:none;">
      <div class="playlist-header">
        <h2>Playlists</h2>
        <button id="playlistToggle" class="playlist-toggle" aria-expanded="false">Show</button>
      </div>
      <div id="playlistContainer" class="playlist-list">
        <div class="playlist-grid" id="playlistGrid"></div>
      </div>
    </section>

    <!-- Grid -->
    <div id="videoGrid" class="video-grid"></div>

    <footer id="footInfo"></footer>
  </div>

  <!-- Popup -->
  <div id="popupOverlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div id="popupBox">
      <h2 id="popupTitle">YOUR ALMOST THERE!</h2>
      <div id="popupMsg"></div>
      <button id="popupClose">STEP OUT THE MATRIX</button>
    </div>
  </div>

  <!-- Tiny boot scripts: cursor + theme init + clock -->
  <script>
    /* cursor */
    (function(){
      const cur = document.getElementById('cursor');
      const isTouch = matchMedia("(pointer:coarse)").matches;
      if (isTouch) { cur.style.opacity = 0; return; }
      window.addEventListener('mousemove', (e)=>{
        cur.style.opacity = 1;
        cur.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      });
      document.addEventListener('mouseleave', ()=> cur.style.opacity = 0);
    })();

    /* themes (keep all 30) */
    const themes = [
      "dark","light","grey","pink","blue","vaporwave","solarized-dark","dracula","cyberpunk","sepia","midnight",
      "facebook","mcdonalds","walmart","office","discord","netflix","apple","google","amazon","spotify","twitch",
      "youtube","terminal","desert","ocean","forest","blood","gold","ice"
    ];
    const themeSelect = document.getElementById("themeSelect");
    themes.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t; opt.textContent = t;
      themeSelect.appendChild(opt);
    });
    function setTheme(t){ document.body.className = t; localStorage.setItem("preferredTheme", t); }
    (function initTheme(){
      const saved = localStorage.getItem("preferredTheme") || "dark";
      setTheme(saved);
      themeSelect.value = saved;
    })();
    themeSelect.addEventListener("change", () => {
      if (themes.includes(themeSelect.value)) setTheme(themeSelect.value);
    });

    /* footer device/time */
    function device(){
      const u = navigator.userAgent.toLowerCase();
      if (u.includes("iphone")) return "iPhone";
      if (u.includes("ipad")) return "iPad";
      if (u.includes("android")) return "Android";
      if (u.includes("mac")) return "Mac";
      if (u.includes("win")) return "PC";
      if (u.includes("linux")) return "Linux";
      return "Device";
    }
    function updateFooter(){ document.getElementById("footInfo").textContent = new Date().toLocaleTimeString() + " | " + device(); }
    updateFooter();
    setInterval(updateFooter, 1000);
  </script>

  <!-- Core app logic -->
  <script src="videos.js"></script>
</body>
</html>
