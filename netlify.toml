[build]
command = "python3 -I lite_site.py --catalog videos.json --output generated-artifacts/netlify-lite"
publish = "generated-artifacts/netlify-lite"

[build.environment]
PYTHON_VERSION = "3.11"

# Admin is hosted only on the Pi. Never copy its UI into the static output.
[[redirects]]
from = "/admin"
to = "https://woke.you2mp3.music/admin"
status = 302
force = true

[[redirects]]
from = "/admin/"
to = "https://woke.you2mp3.music/admin"
status = 302
force = true

[[redirects]]
from = "/editor.html"
to = "https://woke.you2mp3.music/admin"
status = 302
force = true

[[redirects]]
from = "/editor"
to = "https://woke.you2mp3.music/admin"
status = 302
force = true

[[headers]]
for = "/service-worker.js"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/lite-data.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/videos.json"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/build-info.json"
[headers.values]
Cache-Control = "no-store"
