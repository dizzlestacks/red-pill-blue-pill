<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Video JSON Editor</title>
  <link rel="stylesheet" href="themes.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { margin:0; padding:0; overflow-x:hidden; }
    body { background:var(--bg); color:var(--fg); font-family:'Share Tech Mono',monospace; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 16px 14px 60px; display:flex; flex-direction:column; align-items:center; gap:16px; }
    .row-top { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
    label.small { font-size:.9rem; opacity:.85; }
    select#themeSelect { background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-width: 160px; max-width: 60vw; box-shadow: var(--shadow); }
    .card { width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:14px; }
    h1,h2,h3 { margin:0 0 10px 0; text-align:center; }
    h1 { font-size:1.3rem; color:var(--muted); }
    h2 { font-size:1.05rem; color:var(--muted); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:640px){ .grid{grid-template-columns:1fr;} }
    input, textarea, select, button { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--fg); font-family:inherit; font-size:1rem; }
    textarea { resize:vertical; min-height:110px; }
    .row { display:flex; gap:10px; justify-content:center; margin-top:8px; }
    .row label { display:flex; align-items:center; gap:6px; }
    .btns { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:6px; }
    .btn { cursor:pointer; border:1px solid var(--border); background:color-mix(in srgb, var(--accent) 10%, var(--card)); color:var(--fg); font-weight:600; }
    .btn.primary { border:1px solid var(--accent); }
    .btn.danger { border:1px solid #a33; }
    .muted { color:color-mix(in srgb,var(--fg)70%,transparent); font-size:.9rem; text-align:center; }
    details { width:100%; border:1px dashed var(--border); border-radius:10px; padding:10px; background:color-mix(in srgb,var(--card)92%,var(--bg)); }
    summary { cursor:pointer; list-style:none; font-weight:600; display:flex; align-items:center; gap:8px; }
    summary::-webkit-details-marker { display:none; }
    pre { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--fg); padding:14px; border-radius:10px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
    .hint { text-align:center; font-size:.9rem; color:color-mix(in srgb,var(--fg)70%,transparent); }
  </style>
</head>
<body class="dark">
  <div class="wrap">
    <div class="row-top">
      <label class="small" for="themeSelect">Themes</label>
      <select id="themeSelect">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="grey">Grey</option>
        <option value="pink">Pink</option>
        <option value="blue">Blue</option>
        <option value="vaporwave">Vaporwave</option>
        <option value="solarized-dark">Solarized Dark</option>
        <option value="dracula">Dracula</option>
        <option value="cyberpunk">Cyberpunk</option>
        <option value="sepia">Sepia</option>
        <option value="midnight">Midnight</option>
        <option value="facebook">Facebook</option>
        <option value="mcdonalds">McDonalds</option>
        <option value="walmart">Walmart</option>
        <option value="office">Office</option>
        <option value="discord">Discord</option>
        <option value="netflix">Netflix</option>
        <option value="apple">Apple</option>
        <option value="google">Google</option>
        <option value="amazon">Amazon</option>
        <option value="spotify">Spotify</option>
        <option value="twitch">Twitch</option>
        <option value="youtube">YouTube</option>
        <option value="terminal">Terminal</option>
        <option value="desert">Desert</option>
        <option value="ocean">Ocean</option>
        <option value="forest">Forest</option>
        <option value="blood">Blood</option>
        <option value="gold">Gold</option>
        <option value="ice">Ice</option>
      </select>
    </div>

    <!-- Single JSON -->
    <div class="card">
      <h1>Video JSON Builder</h1>
      <div class="grid">
        <input id="title" placeholder="Title" />
        <input id="yt" placeholder="YouTube link or ID (video/playlist)" />
        <input id="url" placeholder="Direct video URL (optional)" />
        <input id="category1" placeholder="Category 1" list="savedCategories" />
        <input id="category2" placeholder="Category 2 (optional)" list="savedCategories" />
        <input id="tags" placeholder="Tags (comma-separated)" />
      </div>
      <datalist id="savedCategories"></datalist>
      <div class="row">
        <label><input type="checkbox" id="featured"> Featured</label>
        <label><input type="checkbox" id="pinned"> Pinned</label>
      </div>

      <div id="singleBtns" class="btns">
        <button class="btn primary" id="genOne">Generate JSON</button>
        <button class="btn" id="copyOne">Copy JSON</button>
        <button class="btn danger" id="clearForm">Clear Form</button>
      </div>

      <pre id="output">Fill the form then Generate…</pre>
      <div class="hint">Format matches <code>videos.json</code> items exactly.</div>
    </div>

    <!-- Batch panel -->
    <details id="batchPanel">
      <summary>📦 Batch Builder</summary>
      <div class="muted">Queue multiple items; export as <code>{"popup":{…},"videos":[…]}</code>.</div>
      <div class="btns">
        <button class="btn primary" id="addBatch">Add to Batch</button>
        <button class="btn" id="genBatch">Generate Batch JSON</button>
        <button class="btn" id="copyBatch">Copy Batch JSON</button>
        <button class="btn danger" id="clearBatch">Clear Batch</button>
      </div>
      <pre id="batchList">No items in batch yet.</pre>
    </details>

    <!-- Popup panel -->
    <details id="popupPanel">
      <summary>🔔 Popup Settings</summary>
      <div class="row">
        <label><input type="checkbox" id="popupEnabled"> Enabled</label>
      </div>
      <textarea id="popupMsg" placeholder="Popup message (only included in batch export)"></textarea>
      <div class="muted">Tip: multi-line text is supported. This panel doesn’t affect single-item JSON.</div>
    </details>
  </div>

<script>
function buildVideoObject() {
  const ytVal = document.getElementById('yt').value.trim();
  let youtube_id = ytVal;
  if (ytVal.includes("youtube.com") || ytVal.includes("youtu.be")) {
    const url = new URL(ytVal);
    if (url.searchParams.get("v")) youtube_id = url.searchParams.get("v");
    else if (url.pathname.startsWith("/playlist")) youtube_id = url.searchParams.get("list");
    else youtube_id = url.pathname.split("/").pop();
  }
  const cats = [];
  if (document.getElementById('category1').value) cats.push(document.getElementById('category1').value);
  if (document.getElementById('category2').value) cats.push(document.getElementById('category2').value);

  return {
    "title": document.getElementById('title').value,
    "youtube_id": youtube_id || "",
    ...(document.getElementById('url').value ? {"url": document.getElementById('url').value} : {}),
    ...(cats.length ? {"category": cats.length === 1 ? cats[0] : cats} : {}),
    "tags": document.getElementById('tags').value.split(",").map(t=>t.trim()).filter(Boolean),
    "added": new Date().toISOString(),
    "featured": document.getElementById('featured').checked,
    "pinned": document.getElementById('pinned').checked
  };
}

let batch = [];

/* Single JSON */
document.getElementById('genOne').addEventListener('click', ()=>{
  const obj = buildVideoObject();
  const formatted = JSON.stringify(obj, null, 2)
    .split("\n").map(line=>"  "+line).join("\n"); // indent
  document.getElementById('output').textContent = formatted + ",";
});

document.getElementById('copyOne').addEventListener('click', ()=>{
  navigator.clipboard.writeText(document.getElementById('output').textContent);
});

document.getElementById('clearForm').addEventListener('click', ()=>{
  document.getElementById('title').value="";
  document.getElementById('yt').value="";
  document.getElementById('url').value="";
  document.getElementById('category1').value="";
  document.getElementById('category2').value="";
  document.getElementById('tags').value="";
  document.getElementById('featured').checked=false;
  document.getElementById('pinned').checked=false;
  document.getElementById('output').textContent="Fill the form then Generate…";
});

/* Batch JSON */
document.getElementById('addBatch').addEventListener('click', ()=>{
  batch.push(buildVideoObject());
  document.getElementById('batchList').textContent = batch.map((o,i)=>`#${i+1} ${o.title}`).join("\n") || "No items in batch yet.";
  document.getElementById('title').value="";
  document.getElementById('yt').value="";
  document.getElementById('url').value="";
  document.getElementById('category1').value="";
  document.getElementById('category2').value="";
  document.getElementById('tags').value="";
  document.getElementById('featured').checked=false;
  document.getElementById('pinned').checked=false;
});

document.getElementById('genBatch').addEventListener('click', ()=>{
  const popupEnabled = document.getElementById('popupEnabled').checked;
  const popupMsg = document.getElementById('popupMsg').value.trim();
  let videosJSON = batch.map(o=>{
    return JSON.stringify(o,null,2).split("\n").map(line=>"  "+line).join("\n") + ",";
  }).join("\n");
  videosJSON = videosJSON.replace(/,+$/,""); // no trailing comma
  let finalJSON = "";
  if (popupEnabled && popupMsg) {
    finalJSON = `{\n  "popup": {\n    "enabled": true,\n    "message": ${JSON.stringify(popupMsg)}\n  },\n  "videos": [\n${videosJSON}\n  ]\n}`;
  } else {
    finalJSON = `{\n  "videos": [\n${videosJSON}\n  ]\n}`;
  }
  document.getElementById('batchList').textContent = finalJSON;
});

document.getElementById('copyBatch').addEventListener('click', ()=>{
  navigator.clipboard.writeText(document.getElementById('batchList').textContent);
});

document.getElementById('clearBatch').addEventListener('click', ()=>{
  batch = [];
  document.getElementById('batchList').textContent="No items in batch yet.";
});

/* Theme selector */
document.getElementById('themeSelect').addEventListener('change', e=>{
  document.body.className = e.target.value;
});
</script>
</body>
</html>
